services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: assistant
      POSTGRES_PASSWORD: secretpassword123
      POSTGRES_DB: personal_assistant
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assistant -d personal_assistant"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://assistant:secretpassword123@db:5432/personal_assistant
      APP_ENV: development
      PORT: 8000
    env_file:
      - .env
    volumes:
      - .:/app
      - app_storage:/app/storage
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  app_storage:
